name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version sync + CHANGELOG check
        run: bash scripts/check_version_sync.sh
      - name: Install docs render test dependencies
        # tests/test_docs_md2docx.py renders real .docx through md2docx.py, which needs python-docx, PyYAML
        # and a pandoc binary. pypandoc_binary ships pandoc as a wheel (no apt step); the script
        # falls back to it when pandoc is not on PATH. CI/test tooling only, exempt from the
        # "uv run --with, never pip install" rule (see CLAUDE.md § Plugin Skill Constraint).
        run: pip install python-docx pyyaml pypandoc_binary pypdf
      - name: Tests
        run: |
          # Capture output so we can fail closed when discovery collects zero tests:
          # `unittest discover` exits 0 on "Ran 0 tests", which would let a broken
          # test wiring pass CI silently.
          output="$(python3 -m unittest discover -s tests -v 2>&1)"
          echo "$output"
          if grep -qE '^Ran 0 tests' <<<"$output"; then
            echo "FAIL: zero tests collected — test discovery is broken."
            exit 1
          fi
