name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version sync + CHANGELOG check
        run: bash scripts/check_version_sync.sh
      - name: Tests
        run: |
          # Capture output so we can fail closed when discovery collects zero tests:
          # `unittest discover` exits 0 on "Ran 0 tests", which would let a broken
          # test wiring pass CI silently.
          output="$(python3 -m unittest discover -s tests -v 2>&1)"
          echo "$output"
          if grep -qE '^Ran 0 tests' <<<"$output"; then
            echo "FAIL: zero tests collected — test discovery is broken."
            exit 1
          fi
