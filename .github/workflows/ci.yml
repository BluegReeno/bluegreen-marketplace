name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version sync + CHANGELOG check
        run: bash scripts/check_version_sync.sh
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
