name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # ui/edifice-front depends on @bluegreeno/annotation-core, a PRIVATE package on
  # GitHub Packages. Declaring this block at all drops every unlisted permission to
  # `none`, so `packages: read` has to be spelled out — without it GITHUB_TOKEN is
  # refused by npm.pkg.github.com whatever the package's access settings say.
  packages: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version sync + CHANGELOG check
        run: bash scripts/check_version_sync.sh
      - name: Install edifice render test dependencies
        # tests/test_edifice_render_smoke.py opens real .docx output with python-docx —
        # unlike the other render tests, it can't mock docxtpl/PIL away. This is CI/test
        # tooling only, not a runtime skill script, so it's exempt from the "uv run --with,
        # never pip install" rule (see CLAUDE.md § Plugin Skill Constraint).
        run: pip install -r plugins/edifice/requirements.txt
      - name: Detect ui/ changes
        uses: dorny/paths-filter@v4
        id: ui-changes
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          filters: |
            ui:
              - 'ui/**'
              - 'plugins/edifice/artifacts/**'
      - uses: pnpm/action-setup@v4
        if: steps.ui-changes.outputs.ui == 'true'
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        if: steps.ui-changes.outputs.ui == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'ui/pnpm-lock.yaml'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bluegreeno'
      - name: Artifact sync check
        if: steps.ui-changes.outputs.ui == 'true'
        env:
          # Reads @bluegreeno/annotation-core, published from BluegReeno/edifice and
          # private. A workflow's GITHUB_TOKEN is scoped to its own repo, so reading a
          # package published from another one requires that package to grant this repo
          # Read under "Manage Actions access" — granted 2026-07-28. No PAT needed, and
          # no secret to rotate: GITHUB_TOKEN is minted per run and dies with it.
          # If this ever 401s, check the grant on the package page first; the owner is a
          # User account, so there is no API to read that list back (/repositories is
          # org-only and 404s here).
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check_artifact_sync.sh
      - name: Tests
        run: |
          # Capture output so we can fail closed when discovery collects zero tests:
          # `unittest discover` exits 0 on "Ran 0 tests", which would let a broken
          # test wiring pass CI silently.
          # Runs after the (ui-changes-gated) Artifact sync check above so that
          # tests/test_build_artifact.py's node subprocess has ui/node_modules
          # available whenever ui/** changed; it skips itself otherwise.
          output="$(python3 -m unittest discover -s tests -v 2>&1)"
          echo "$output"
          if grep -qE '^Ran 0 tests' <<<"$output"; then
            echo "FAIL: zero tests collected — test discovery is broken."
            exit 1
          fi
