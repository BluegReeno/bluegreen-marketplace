name: skill-improve
description: |
  Fix a skill improvement issue from renaud-marketplace or bluegreen-marketplace.
  Handles the full cycle: fetch issue → implement → PR → version bump verification.

  Use when: "fix this skill issue", "improve skill", "implement skill improvement #n"
  Input: GitHub issue number (e.g. "#42" or "42")

  Suggested invocation:
    archon workflow run skill-improve "42"

provider: claude
model: sonnet

nodes:
  # ───────────────────────────────────────────────────────────────
  # Node 1 — read skill conventions before the fix runs
  # ───────────────────────────────────────────────────────────────
  - id: read-skill-context
    context: fresh
    denied_tools: [Write, Edit, Bash]
    prompt: |
      Read skill-specific conventions before the fix runs.

      Issue: $ARGUMENTS

      Read these files:
      1. `CLAUDE.md` — versioning rules (the three-file sync rule is critical)
      2. `.claude-plugin/marketplace.json` — current plugin versions
      3. `plugins/` directory listing — know what plugins exist

      Output the following in your response (will be captured as node output):
      - The three-file version sync rule (verbatim from CLAUDE.md)
      - Current plugin versions from marketplace.json
      - List of existing plugins and their skills

  # ───────────────────────────────────────────────────────────────
  # Node 2 — implement the fix and open a PR
  # ───────────────────────────────────────────────────────────────
  - id: fix
    depends_on: [read-skill-context]
    context: fresh
    prompt: |
      You are implementing a GitHub issue fix for a Claude Code skill plugin in this repo.

      Issue number: $ARGUMENTS

      Skill conventions (MUST follow — from CLAUDE.md):
      $read-skill-context.output

      ## Steps

      ### 1. Fetch the issue
      Run: `gh issue view $ARGUMENTS --json number,title,body,labels`
      Read the full issue body. Understand exactly what needs to change.

      ### 2. Identify the files to change
      Based on the issue:
      - Skill changes → `plugins/<plugin>/skills/<skill>/SKILL.md`
      - MCP/server changes → note them in the PR body (out of scope for this repo if they
        require the private `hal` repo; document what must change there)
      - Command files → `plugins/<plugin>/commands/<cmd>.md`
      - Scripts → `plugins/<plugin>/scripts/`
      - Tests → `tests/`

      ### 3. Implement
      Make all changes required to resolve the issue. Follow the skill conventions above.
      If the issue asks for a server-side change (hal-mcp, Supabase) that cannot be done
      in this repo, implement the skill/doc side fully and note the server-side work in
      the PR description.

      ### 4. Version bump (THREE-FILE SYNC — non-negotiable)
      After any plugin behaviour change, bump the version in all three files:
      - `plugins/<plugin>/.claude-plugin/plugin.json` → `version`
      - `plugins/<plugin>/skills/<skill>/SKILL.md` → frontmatter `version:`
      - `.claude-plugin/marketplace.json` → plugin entry `version`
      All three must show the SAME version after your commit.
      PATCH bump for fixes; MINOR bump for new flows or tools.

      ### 5. Commit
      Stage only the relevant files. Commit message format:
      ```
      feat(<scope>): <what changed> (#<issue>)

      closes #<issue>

      Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>
      ```

      ### 6. Open a PR
      ```
      gh pr create \
        --title "<concise title under 70 chars>" \
        --body "$(cat <<'EOF'
      ## Summary
      - <bullet 1>
      - <bullet 2>

      ## Test plan
      - [ ] <how to verify>

      closes #<issue>

      🤖 Generated with [Claude Code](https://claude.com/claude-code)
      EOF
      )"
      ```

      Output: the PR URL on success, or a clear error description if blocked.

  # ───────────────────────────────────────────────────────────────
  # Node 3 — verify version bump (most common mistake in this repo)
  # ───────────────────────────────────────────────────────────────
  - id: verify-version-bump
    depends_on: [fix]
    context: fresh
    prompt: |
      Verify the three-file version sync rule after the fix.

      Skill context: $read-skill-context.output

      The rule (from CLAUDE.md):
      On every commit that changes plugin behaviour, these three must be identical:
      1. `plugins/<plugin>/.claude-plugin/plugin.json` → `version`
      2. `plugins/<plugin>/skills/<skill>/SKILL.md` → frontmatter `version:`
      3. `.claude-plugin/marketplace.json` → plugin entry `version`

      Steps:
      1. Identify which plugin was modified: `git diff origin/main...HEAD -- plugins/`
      2. Read the three version values for that plugin
      3. If all three match → output "✅ Version sync OK: <version>"
      4. If any mismatch → fix the diverging files to match the highest version,
         commit: `chore(<plugin>): sync version to <version>`
      5. Output the final version and confirmation

      PATCH bump (0.x.Y+1): for bug fixes, wording, template changes
      MINOR bump (0.X+1.0): for new flow, new tool, new skill
